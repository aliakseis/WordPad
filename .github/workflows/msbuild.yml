name: MSBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: "Unicode Release Static"
            platform: "Win32"
            artifact: "WordPad-Win32"
            triplet: "x86-windows-static"

          - configuration: "Unicode Release Static"
            platform: "x64"
            artifact: "WordPad-x64"
            triplet: "x64-windows-static"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure vcpkg Binary Caching
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV

      - name: Run manual vcpkg install
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --triplet ${{ matrix.triplet }} --x-manifest-root="${{ github.workspace }}"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WordPad.sln
        shell: cmd
        run: msbuild WordPad.sln /m /p:Configuration="${{ matrix.configuration }}" /p:Platform="${{ matrix.platform }}" /p:ForceImportBeforeCppTargets="${{ env.VCPKG_CTX_ROOT }}\scripts\buildsystems\msbuild\vcpkg.props" /p:IncludePath="${{ github.workspace }}\vcpkg_installed\${{ matrix.triplet }}\include;$(IncludePath)" /p:LibraryPath="${{ github.workspace }}\vcpkg_installed\${{ matrix.triplet }}\lib;$(LibraryPath)" /p:VcpkgTriplet="${{ matrix.triplet }}" /p:VcpkgManifestInstalledBaseDir="${{ github.workspace }}\vcpkg_installed\\" /verbosity:minimal

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            **/*.exe
            **/*.dll

name: MSBuild

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: "Unicode Release Static"
            platform: "Win32"
            artifact: "WordPad-Win32"
            triplet: "x86-windows-static"

          - configuration: "Unicode Release Static"
            platform: "x64"
            artifact: "WordPad-x64"
            triplet: "x64-windows-static"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure vcpkg Binary Caching
        shell: bash
        run: |
          echo "VCPKG_BINARY_SOURCES=clear;x-gha,readwrite" >> $GITHUB_ENV

      - name: Expose System VCPKG Root to GitHub Context
        shell: pwsh
        run: |
          echo "VCPKG_CTX_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=${{ matrix.triplet }}" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build WordPad.sln
        run: msbuild WordPad.sln /m /p:Configuration="${{ matrix.configuration }}" /p:Platform="${{ matrix.platform }}" /p:VcpkgPropsPath="${{ env.VCPKG_CTX_ROOT }}/scripts/buildsystems/msbuild/vcpkg.props" /p:VcpkgTargetsPath="${{ env.VCPKG_CTX_ROOT }}/scripts/buildsystems/msbuild/vcpkg.targets" /p:CustomAfterMicrosoftCppProps="${{ env.VCPKG_CTX_ROOT }}/scripts/buildsystems/msbuild/vcpkg.props" /p:CustomAfterMicrosoftCppTargets="${{ env.VCPKG_CTX_ROOT }}/scripts/buildsystems/msbuild/vcpkg.targets" /p:VcpkgTriplet="${{ matrix.triplet }}" /p:VcpkgEnabled=true /p:VcpkgEnableManifest=true /verbosity:minimal

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            **/*.exe
            **/*.dll
